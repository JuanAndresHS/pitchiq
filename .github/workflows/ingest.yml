name: Daily data ingestion

# Keeps the Premier League dataset current without manual intervention.
on:
  schedule:
    # 06:00 UTC daily — after European matchdays have finished and been settled.
    - cron: "0 6 * * *"
  workflow_dispatch: # allows manual runs from the Actions tab

# Required so the workflow can commit refreshed data back to the repository.
permissions:
  contents: write

jobs:
  ingest:
    name: Fetch latest matches
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch current season
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python src/ingestion/fetch_matches.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/

          # Exit cleanly when nothing changed — a no-op run is not a failure.
          if git diff --staged --quiet; then
            echo "No new data. Nothing to commit."
            exit 0
          fi

          git commit -m "data: refresh Premier League matches ($(date -u +'%Y-%m-%d'))"
          git push