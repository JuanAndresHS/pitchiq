name: Ingest results

# Fetches match data only. No model fitting: the point is to pick up scores
# soon after they settle, and refitting eight models for that would make every
# run slower and the forecasts flicker through the day.
#
# Times are UTC and sit on an odd minute on purpose. GitHub queues scheduled
# workflows, and the queue is deepest on the hour and half hour — the same
# schedule written as :00 routinely lands hours late.
on:
  schedule:
    # Saturday and Sunday, every two hours across the European match day.
    - cron: "17 11,13,15,17,19,21,23 * * 6,0"
    # Tuesday and Wednesday evenings: Champions League.
    - cron: "17 19,21,23 * * 2,3"
    # Monday, Thursday and Friday: one late sweep for the odd evening fixture.
    - cron: "17 23 * * 1,4,5"
  workflow_dispatch:

permissions:
  contents: write

# Shared with the retraining workflow. Two jobs writing the same files would
# race on the commit, so they queue instead.
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  ingest:
    name: Fetch latest results
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch latest results
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python src/ingestion/fetch_matches.py

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/

          # Most runs find nothing new. Exiting here keeps the history readable
          # and stops Vercel rebuilding for an identical dataset.
          if git diff --staged --quiet; then
            echo "No new results. Nothing to commit."
            exit 0
          fi

          git commit -m "data: refresh results ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # The retraining workflow or a manual push can land in between.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed — retrying."
            sleep 5
          done
          exit 1