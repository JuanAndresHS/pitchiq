name: Daily update

# Keeps results, models and forecasts current across every league without
# manual intervention.
on:
  schedule:
    # 21:30 UTC — after the last European match of the day has finished and the
    # result has settled.
    - cron: "30 21 * * *"
    # 06:00 UTC — catches late kick-offs, midweek fixtures and rescheduled games.
    - cron: "0 6 * * *"
  workflow_dispatch: # allows manual runs from the Actions tab

# Required so the workflow can commit refreshed data back to the repository.
permissions:
  contents: write

# A second run starting while the first is mid-commit would race on the same
# files, so queue them instead.
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    name: Fetch results and refresh forecasts
    runs-on: ubuntu-latest
    # Five leagues, throttled to stay inside the API's rate limit, plus five
    # model fits. Well under this, but the ceiling stops a hung run burning
    # minutes.
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch latest results
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python src/ingestion/fetch_matches.py

      - name: Retrain models and refresh forecasts
        run: python src/models/train_and_forecast.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/ data/predictions/

          # Exit cleanly when nothing changed — a no-op run is not a failure.
          if git diff --staged --quiet; then
            echo "No new data. Nothing to commit."
            exit 0
          fi

          git commit -m "data: refresh results and forecasts ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
